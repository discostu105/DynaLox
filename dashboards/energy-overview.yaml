id: "3f8f5e42-3bc5-4340-9b24-e94f97f2e012"
name: "Loxone Energy Overview"
type: dashboard
content:
  annotations: []
  importedWithCode: false
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  layouts:
    # Row 0: Header
    "header":
      x: 0
      "y": 0
      w: 24
      h: 1
    # Row 1: KPI tiles
    "consumption-now":
      x: 0
      "y": 1
      w: 6
      h: 3
    "grid-now":
      x: 6
      "y": 1
      w: 6
      h: 3
    "battery-now":
      x: 12
      "y": 1
      w: 6
      h: 3
    "self-consumption":
      x: 18
      "y": 1
      w: 6
      h: 3
    # Row 4: Power over time
    "power-header":
      x: 0
      "y": 4
      w: 24
      h: 1
    "power-timeseries":
      x: 0
      "y": 5
      w: 24
      h: 7
    # Row 12: Energy flow
    "flow-header":
      x: 0
      "y": 12
      w: 24
      h: 1
    "grid-power":
      x: 0
      "y": 13
      w: 8
      h: 3
    "solar-power":
      x: 8
      "y": 13
      w: 8
      h: 3
    "storage-power":
      x: 16
      "y": 13
      w: 8
      h: 3
    # Row 16: Consumer breakdown
    "consumers-header":
      x: 0
      "y": 16
      w: 24
      h: 1
    "consumer-pie":
      x: 0
      "y": 17
      w: 12
      h: 7
    "consumer-table":
      x: 12
      "y": 17
      w: 12
      h: 7
  tiles:
    "header":
      content: "## ⚡ Energy Overview"
      type: markdown
    "consumption-now":
      title: "Total Consumption"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }
        | fieldsAdd last = arrayLast(val)
        | fields last
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: "kW"
          recordField: last
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #d94040)'
            isEnabled: true
            value: 5
          - color: 'var(--dt-colors-charts-status-warning-default, #f5d30f)'
            isEnabled: true
            value: 3
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "grid-now":
      title: "Grid Draw"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" }
        | fieldsAdd last = arrayLast(val)
        | fields last
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: "kW"
          recordField: last
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #d94040)'
            isEnabled: true
            value: 4
          - color: 'var(--dt-colors-charts-status-warning-default, #f5d30f)'
            isEnabled: true
            value: 2
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "battery-now":
      title: "Battery Storage"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Speicher" AND state.name == "storage" AND unit == "kW" }
        | fieldsAdd last = arrayLast(val)
        | fields last
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: "kW"
          recordField: last
          trend:
            isVisible: false
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "self-consumption":
      title: "Self-Consumption"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Energiefluss" AND state.name == "selfConsumption" }
        | fieldsAdd last = arrayLast(val)
        | fields last
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: "%"
          recordField: last
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 70
          - color: 'var(--dt-colors-charts-status-warning-default, #f5d30f)'
            isEnabled: true
            value: 40
          - color: 'var(--dt-colors-charts-status-critical-default, #d94040)'
            isEnabled: true
            value: 0
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "power-header":
      content: "### Power Over Time"
      type: markdown
    "power-timeseries":
      title: "Power (kW)"
      type: data
      query: >-
        timeseries {
          consumption = avg(loxone.control.value, filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }),
          grid = avg(loxone.control.value, filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" }),
          heating = avg(loxone.control.value, filter: { control.name == "Heizung" AND state.name == "actual" AND unit == "kW" }),
          battery = avg(loxone.control.value, filter: { control.name == "Speicher" AND state.name == "actual" AND unit == "kW" })
        }
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: false
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "flow-header":
      content: "### Energy Flow"
      type: markdown
    "grid-power":
      title: "Grid Power (Gpwr)"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Energiefluss" AND state.name == "Gpwr" AND unit == "kW" }
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "solar-power":
      title: "PV Production (Ppwr)"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Energiefluss" AND state.name == "Ppwr" }
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              seriesId:
                - val
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "storage-power":
      title: "Storage Power (Spwr)"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.name == "Energiefluss" AND state.name == "Spwr" AND unit == "kW" }
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "consumers-header":
      content: "### Per-Consumer Breakdown"
      type: markdown
    "consumer-pie":
      title: "Energy Today by Consumer"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.category == "Energie" AND state.name == "totalDay" AND unit == "kW" AND control.type == "Meter" },
        by: { control.name }
        | fieldsAdd latest = arrayLast(val)
        | filter isNotNull(latest) AND latest > 0
        | fields control.name, latest
        | sort latest desc
      visualization: pieChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          circleChartSettings:
            groupingThresholdType: relative
            valueType: relative
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
    "consumer-table":
      title: "Energy Consumption Details"
      type: data
      query: >-
        timeseries val = avg(loxone.control.value),
        filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND control.type == "Meter" },
        by: { control.name }
        | fieldsAdd current_kW = arrayLast(val)
        | filter isNotNull(current_kW)
        | fields control.name, current_kW
        | sort current_kW desc
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
        thresholds: []
      davis:
        enabled: false
        davisVisualization:
          isAvailable: true
