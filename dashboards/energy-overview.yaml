  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    battery-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Speicher" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Battery Power
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
          trend:
            isVisible: false
        unitsOverrides:
          - added: 1.773585189257e+12
            baseUnit: kilo-watt
            decimals: null
            delimiter: false
            identifier: last
            suffix: ""
            unitCategory: power
    battery-soc:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Speicher" AND state.name == "storage" } | fieldsAdd last = arrayLast(val) | fields last'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Battery SoC
      type: data
      visualization: gauge
      visualizationSettings:
        autoSelectVisualization: false
        valueBoundaries:
          max:
            mode: custom
            value: 100
    consumer-honeycomb:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND control.type == "Meter" }, by: { control.name } | fieldsAdd current_kW = arrayLast(val) | filter isNotNull(current_kW) AND current_kW > 0 | fields control.name, current_kW | sort current_kW desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Active Consumers
      type: data
      visualization: honeycomb
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: blue
              comparator: = *value*
              field: current_kW
              type: string
              value: ""
        honeycomb:
          colorPalette: blue
          dataMappings:
            value: current_kW
          displayedFields:
            - control.name
          legend:
            hidden: true
    consumer-table:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND control.type == "Meter" }, by: { control.name }
        | fieldsAdd current_kW = arrayLast(val)
        | filter isNotNull(current_kW) AND current_kW > 0
        | fields control.name, current_kW, val, timeframe, interval
        | sort current_kW desc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Consumer Details
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
        table:
          columnTypeOverrides:
            - disableRemoval: false
              fields:
                - val
              id: 1.773585280996e+12
              value: sparkline
          columnWidths:
            '["control.name"]': 200
            '["current_kW"]': 100
            '["val"]': 300
    consumers-header:
      content: "#### \U0001F3F7️ Per-Consumer Breakdown"
      type: markdown
    consumption-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Total Consumption
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 5
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 3
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    flow-header:
      content: "#### \U0001F504 Energy Flow"
      type: markdown
    grid-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Grid Draw
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 4
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 2
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    grid-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Gpwr" AND unit == "kW" }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Grid Power (Gpwr)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              seriesId:
                - val
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              field: DT.name
              type: string
              value: val
    header:
      content: |-
        ### ⚡ Energy Overview
        Real-time power consumption, solar production, battery storage, and per-consumer breakdown.
      type: markdown
    heating-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Heizung" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Heating
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
          trend:
            isVisible: false
        unitsOverrides:
          - added: 1.773585189258e+12
            baseUnit: kilo-watt
            decimals: null
            delimiter: false
            identifier: last
            suffix: ""
            unitCategory: power
    power-header:
      content: "#### \U0001F4C8 Power Over Time"
      type: markdown
    power-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          consumption = avg(loxone.control.value, filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }),
          grid = avg(loxone.control.value, filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" }),
          pv = avg(loxone.control.value, filter: { control.name == "PV-Strom" AND state.name == "actual" AND unit == "kW" }),
          heating = avg(loxone.control.value, filter: { control.name == "Heizung" AND state.name == "actual" AND unit == "kW" }),
          battery = avg(loxone.control.value, filter: { control.name == "Speicher" AND state.name == "actual" AND unit == "kW" })
        }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Power (kW)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-13-default, #006bba)'
              seriesId:
                - consumption
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              seriesId:
                - grid
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              seriesId:
                - pv
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
              seriesId:
                - heating
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              seriesId:
                - battery
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-color-13-default, #006bba)'
              field: DT.name
              type: string
              value: consumption
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              field: DT.name
              type: string
              value: grid
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              field: DT.name
              type: string
              value: pv
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
              field: DT.name
              type: string
              value: heating
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              field: DT.name
              type: string
              value: battery
    pv-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "PV-Strom" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: PV Production
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 3
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 1
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 0
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    self-consumption:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          consumption = avg(loxone.control.value, filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }),
          grid = avg(loxone.control.value, filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" })
        }
        | fieldsAdd rate = (1.0 - arrayLast(grid) / arrayLast(consumption)) * 100
        | fields rate
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Self-Consumption
      type: data
      visualization: gauge
      visualizationSettings:
        autoSelectVisualization: false
        valueBoundaries:
          max:
            mode: custom
            value: 100
    solar-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Ppwr" }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: PV Production (Ppwr)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              seriesId:
                - val
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              field: DT.name
              type: string
              value: val
    storage-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Spwr" AND unit == "kW" }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Storage Power (Spwr)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              seriesId:
                - val
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              field: DT.name
              type: string
              value: val
