id: 3f8f5e42-3bc5-4340-9b24-e94f97f2e012
name: Loxone Energy Overview
type: dashboard
content:
  annotations: []
  importedWithCode: false
  layouts:
    header:
      h: 2
      w: 24
      x: 0
      "y": 0
    consumption-now:
      h: 3
      w: 4
      x: 0
      "y": 2
    grid-now:
      h: 3
      w: 4
      x: 4
      "y": 2
    pv-now:
      h: 3
      w: 3
      x: 8
      "y": 2
    self-consumption:
      h: 3
      w: 3
      x: 11
      "y": 2
    heating-now:
      h: 3
      w: 4
      x: 14
      "y": 2
    battery-now:
      h: 3
      w: 3
      x: 18
      "y": 2
    battery-soc:
      h: 3
      w: 3
      x: 21
      "y": 2
    power-header:
      h: 1
      w: 24
      x: 0
      "y": 5
    power-timeseries:
      h: 7
      w: 24
      x: 0
      "y": 6
    flow-header:
      h: 1
      w: 24
      x: 0
      "y": 13
    grid-power:
      h: 5
      w: 8
      x: 0
      "y": 14
    solar-power:
      h: 5
      w: 8
      x: 8
      "y": 14
    storage-power:
      h: 5
      w: 8
      x: 16
      "y": 14
    consumers-header:
      h: 1
      w: 24
      x: 0
      "y": 19
    consumer-honeycomb:
      h: 6
      w: 12
      x: 0
      "y": 20
    consumer-table:
      h: 6
      w: 12
      x: 12
      "y": 20
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    header:
      content: |-
        <img src="https://www.loxone.com/int/wp-content/uploads/sites/21/2022/06/IG-Miniserver.png" height="100" />
        ### ⚡ Energy Overview
        Real-time power consumption, solar production, battery storage, and per-consumer breakdown.
      type: markdown
    consumption-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      title: Total Consumption
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 5
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 3
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    grid-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      title: Grid Draw
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 4
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 2
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    pv-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "PV-Strom" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      title: PV Production
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 3
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 1
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 0
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    heating-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Heizung" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      title: Heating
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isVisible: true
          trend:
            isVisible: false
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    battery-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Speicher" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val)'
      title: Battery Power
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
            isVisible: true
          trend:
            isVisible: false
        unitsOverrides:
          - baseUnit: kilo-watt
            identifier: last
            unitCategory: power
    battery-soc:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Speicher" AND state.name == "storage" } | fieldsAdd last = arrayLast(val) | fields last'
      title: Battery SoC
      type: data
      visualization: gauge
      visualizationSettings:
        autoSelectVisualization: false
        colorModeType:
          numericColorPalette: blue
        valueBoundaries:
          max:
            mode: custom
            value: 100
    self-consumption:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          consumption = avg(loxone.control.value, filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }),
          grid = avg(loxone.control.value, filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" })
        }
        | fieldsAdd rate = (1.0 - arrayLast(grid) / arrayLast(consumption)) * 100
        | fields rate
      title: Self-Consumption
      type: data
      visualization: gauge
      visualizationSettings:
        autoSelectVisualization: false
        colorModeType:
          numericColorPalette: green
        valueBoundaries:
          max:
            mode: custom
            value: 100
    power-header:
      content: '#### 📈 Power Over Time'
      type: markdown
    power-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          consumption = avg(loxone.control.value, filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }),
          grid = avg(loxone.control.value, filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" }),
          pv = avg(loxone.control.value, filter: { control.name == "PV-Strom" AND state.name == "actual" AND unit == "kW" }),
          heating = avg(loxone.control.value, filter: { control.name == "Heizung" AND state.name == "actual" AND unit == "kW" }),
          battery = avg(loxone.control.value, filter: { control.name == "Speicher" AND state.name == "actual" AND unit == "kW" })
        }
      title: Power (kW)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-13-default, #006bba)'
              seriesId:
                - consumption
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              seriesId:
                - grid
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              seriesId:
                - pv
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
              seriesId:
                - heating
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              seriesId:
                - battery
    flow-header:
      content: '#### 🔄 Energy Flow'
      type: markdown
    grid-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Gpwr" AND unit == "kW" }'
      title: Grid Power (Gpwr)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              seriesId:
                - val
    solar-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Ppwr" }'
      title: PV Production (Ppwr)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              seriesId:
                - val
    storage-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Spwr" AND unit == "kW" }'
      title: Storage Power (Spwr)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              seriesId:
                - val
    consumers-header:
      content: '#### 🏷️ Per-Consumer Breakdown'
      type: markdown
    consumer-honeycomb:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND control.type == "Meter" }, by: { control.name } | fieldsAdd current_kW = arrayLast(val) | filter isNotNull(current_kW) AND current_kW > 0 | fields control.name, current_kW | sort current_kW desc'
      title: Active Consumers
      type: data
      visualization: honeycomb
      visualizationSettings:
        autoSelectVisualization: false
        honeycomb:
          colorPalette: blue
          dataMappings:
            value: current_kW
          displayedFields:
            - control.name
          legend:
            hidden: true
    consumer-table:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND control.type == "Meter" }, by: { control.name }
        | fieldsAdd current_kW = arrayLast(val)
        | filter isNotNull(current_kW) AND current_kW > 0
        | fields control.name, current_kW, val
        | sort current_kW desc
      title: Consumer Details
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
        table:
          columnTypeOverrides:
            - fields:
                - val
              value: sparkline
          columnWidths:
            '["control.name"]': 200
            '["current_kW"]': 100
            '["val"]': 300
  version: 21
