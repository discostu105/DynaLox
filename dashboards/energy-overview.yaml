id: 3f8f5e42-3bc5-4340-9b24-e94f97f2e012
name: Loxone Energy Overview
type: dashboard
content:
  annotations: []
  importedWithCode: false
  layouts:
    battery-now:
      h: 3
      w: 6
      x: 12
      "y": 1
    consumer-pie:
      h: 7
      w: 12
      x: 0
      "y": 17
    consumer-table:
      h: 7
      w: 12
      x: 12
      "y": 17
    consumers-header:
      h: 1
      w: 24
      x: 0
      "y": 16
    consumption-now:
      h: 3
      w: 6
      x: 0
      "y": 1
    flow-header:
      h: 1
      w: 24
      x: 0
      "y": 12
    grid-now:
      h: 3
      w: 6
      x: 6
      "y": 1
    grid-power:
      h: 3
      w: 8
      x: 0
      "y": 13
    header:
      h: 1
      w: 24
      x: 0
      "y": 0
    power-header:
      h: 1
      w: 24
      x: 0
      "y": 4
    power-timeseries:
      h: 7
      w: 24
      x: 0
      "y": 5
    self-consumption:
      h: 3
      w: 6
      x: 18
      "y": 1
    solar-power:
      h: 3
      w: 8
      x: 8
      "y": 13
    storage-power:
      h: 3
      w: 8
      x: 16
      "y": 13
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    battery-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Speicher" AND state.name == "storage" AND unit == "kW" } | fieldsAdd last = arrayLast(val) | fields last'
      title: Battery Storage
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: kW
          recordField: last
          trend:
            isVisible: false
    consumer-pie:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "totalDay" AND unit == "kW" AND control.type == "Meter" }, by: { control.name } | fieldsAdd latest = arrayLast(val) | filter isNotNull(latest) AND latest > 0 | fields control.name, latest | sort latest desc'
      title: Energy Today by Consumer
      type: data
      visualization: pieChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          circleChartSettings:
            groupingThresholdType: relative
            valueType: relative
    consumer-table:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND control.type == "Meter" }, by: { control.name } | fieldsAdd current_kW = arrayLast(val) | filter isNotNull(current_kW) | fields control.name, current_kW | sort current_kW desc'
      title: Energy Consumption Details
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    consumers-header:
      content: '### Per-Consumer Breakdown'
      type: markdown
    consumption-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val) | fields last'
      title: Total Consumption
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: kW
          recordField: last
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #d94040)'
            isEnabled: true
            value: 5
          - color: 'var(--dt-colors-charts-status-warning-default, #f5d30f)'
            isEnabled: true
            value: 3
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
    flow-header:
      content: '### Energy Flow'
      type: markdown
    grid-now:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" } | fieldsAdd last = arrayLast(val) | fields last'
      title: Grid Draw
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: kW
          recordField: last
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #d94040)'
            isEnabled: true
            value: 4
          - color: 'var(--dt-colors-charts-status-warning-default, #f5d30f)'
            isEnabled: true
            value: 2
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
    grid-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Gpwr" AND unit == "kW" }'
      title: Grid Power (Gpwr)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
    header:
      content: '## ⚡ Energy Overview'
      type: markdown
    power-header:
      content: '### Power Over Time'
      type: markdown
    power-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          consumption = avg(loxone.control.value, filter: { control.name == "Stromverbrauch" AND state.name == "actual" AND unit == "kW" }),
          grid = avg(loxone.control.value, filter: { control.name == "Netzbezug" AND state.name == "actual" AND unit == "kW" }),
          heating = avg(loxone.control.value, filter: { control.name == "Heizung" AND state.name == "actual" AND unit == "kW" }),
          battery = avg(loxone.control.value, filter: { control.name == "Speicher" AND state.name == "actual" AND unit == "kW" })
        }
      title: Power (kW)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
    self-consumption:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "selfConsumption" } | fieldsAdd last = arrayLast(val) | fields last'
      title: Self-Consumption
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: '%'
          recordField: last
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 70
          - color: 'var(--dt-colors-charts-status-warning-default, #f5d30f)'
            isEnabled: true
            value: 40
          - color: 'var(--dt-colors-charts-status-critical-default, #d94040)'
            isEnabled: true
            value: 0
    solar-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Ppwr" }'
      title: PV Production (Ppwr)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              seriesId:
                - val
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-status-success-default, #2a7453)'
              field: DT.name
              type: string
              value: val
    storage-power:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Energiefluss" AND state.name == "Spwr" AND unit == "kW" }'
      title: Storage Power (Spwr)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
  version: 21
