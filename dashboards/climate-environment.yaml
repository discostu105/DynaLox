  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    bt10-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Eintritt Wärmequellenmedium [BT10]" AND state.name == "value" }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Heat Source Inlet (BT10)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-themed-swamps-color-01-default, #006650)'
              seriesId:
                - val
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-themed-swamps-color-01-default, #006650)'
              field: DT.name
              type: string
              value: val
    co2-current:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "CO2" AND state.name == "value" AND unit == "ppm" }, by: { control.room } | fieldsAdd current = arrayLast(val) | filter isNotNull(current) | sort current desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Current CO₂
      type: data
      visualization: heatmap
      visualizationSettings:
        autoSelectVisualization: false
    co2-header:
      content: "#### \U0001F32C️ CO₂ Levels"
      type: markdown
    co2-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "CO2" AND state.name == "value" AND unit == "ppm" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Avg CO₂
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: ppm
          recordField: last
          sparklineSettings:
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 1000
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 800
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
    co2-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "CO2" AND state.name == "value" AND unit == "ppm" }, by: { control.room }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: CO₂ Over Time (ppm)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
    header:
      content: "### \U0001F321️ Climate & Indoor Environment\nRoom temperatures, humidity, CO₂ levels, and heating system performance across all zones."
