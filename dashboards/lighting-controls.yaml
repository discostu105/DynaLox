  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    header:
      content: "### \U0001F4A1 Lighting & Controls\nLight energy metering, motion sensor activity, and presence detection across the house."
      type: markdown
    light-energy-table:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND unit == "kW"
          AND contains(control.name, "Licht") },
        by: { control.name, control.room, state.name }
        | fieldsAdd latest = arrayLast(val)
        | filter isNotNull(latest)
        | filter state.name == "actual" OR state.name == "totalDay" OR state.name == "totalMonth"
        | fieldsAdd metric = if(state.name == "actual", "Current Power", else: if(state.name == "totalDay", "Today", else: "This Month"))
        | fields control.name, control.room, metric, latest
        | sort control.name, metric
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Light Meter Details
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    light-energy-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW"
          AND contains(control.name, "Licht") },
        by: { control.name }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Light Power Over Time (kW)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
    meters-header:
      content: '#### ⚡ Light Energy Meters'
      type: markdown
    motion-header:
      content: "#### \U0001F44B Motion & Presence"
      type: markdown
    motion-oben:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "gang_sensor_oben_motion" AND state.name == "active" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Stairs Up
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-11-default, #627cfe)'
            variant: bar
          trend:
            isVisible: false
    motion-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Präsenzerkennung" AND state.name == "active" }, by: { control.name }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Motion Sensor Activity
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              seriesId:
                - Bewegung
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-11-default, #627cfe)'
              seriesId:
                - gang_sensor_oben_motion
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-15-default, #9033a3)'
              seriesId:
                - gang_sensor_unten_motion
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              field: DT.name
              type: string
              value: Bewegung
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-color-11-default, #627cfe)'
              field: DT.name
              type: string
              value: gang_sensor_oben_motion
            - colorMode: custom-color
              comparator: =
              customColor:
                Default: 'var(--dt-colors-charts-categorical-color-15-default, #9033a3)'
              field: DT.name
              type: string
              value: gang_sensor_unten_motion
    motion-unten:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "gang_sensor_unten_motion" AND state.name == "active" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Stairs Down
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-15-default, #9033a3)'
            variant: bar
          trend:
            isVisible: false
    motion-vorraum:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Bewegung" AND state.name == "active" } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Vorraum Motion
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
            variant: bar
          trend:
            isVisible: false
    vorraum-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = sum(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND contains(control.name, "Licht") } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Total Light Power
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
          trend:
            isVisible: false
        unitsOverrides:
          - added: 1.773585142682e+12
            baseUnit: kilo-watt
            decimals: null
            delimiter: false
            identifier: last
            suffix: ""
            unitCategory: power
    vorraum-today-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = sum(loxone.control.value), filter: { control.category == "Energie" AND state.name == "totalDay" AND unit == "kW" AND contains(control.name, "Licht") } | fieldsAdd last = arrayLast(val)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Light Energy Today
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: kWh
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-13-default, #006bba)'
          trend:
            isVisible: false
    zone-daily-energy:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "totalDay" AND unit == "kW"
          AND contains(control.name, "Licht") },
        by: { control.name }
        | fieldsAdd latest = arrayLast(val)
        | filter isNotNull(latest) AND latest > 0
        | fields control.name, latest
        | sort latest desc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Daily Energy by Zone (kWh)
      type: data
      visualization: pieChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
    zone-header:
      content: "#### \U0001F3E0 Per-Zone Light Energy"
      type: markdown
    zone-honeycomb:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW" AND contains(control.name, "Licht") }, by: { control.name } | fieldsAdd current = arrayLast(val) | filter isNotNull(current) AND current > 0 | fields control.name, current | sort current desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Current Light Power by Zone
      type: data
      visualization: honeycomb
      visualizationSettings:
        autoSelectVisualization: false
        honeycomb:
          colorPalette: yellow-green
          dataMappings:
            value: current
          displayedFields:
            - control.name
          legend:
            hidden: true
  variables: []
