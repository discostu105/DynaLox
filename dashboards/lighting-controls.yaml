id: 019dae61-d4d4-4d22-a329-7f8843709a65
name: Loxone Lighting & Controls
type: dashboard
content:
  annotations: []
  importedWithCode: false
  layouts:
    active-moods:
      h: 6
      w: 12
      x: 0
      "y": 20
    controls-header:
      h: 1
      w: 24
      x: 0
      "y": 19
    header:
      h: 1
      w: 24
      x: 0
      "y": 0
    light-energy-bar:
      h: 7
      w: 12
      x: 12
      "y": 12
    light-energy-table:
      h: 7
      w: 12
      x: 0
      "y": 12
    meters-header:
      h: 1
      w: 24
      x: 0
      "y": 11
    operating-mode:
      h: 3
      w: 8
      x: 0
      "y": 1
    sunrise:
      h: 3
      w: 8
      x: 8
      "y": 1
    sunset:
      h: 3
      w: 8
      x: 16
      "y": 1
    switch-states:
      h: 6
      w: 12
      x: 12
      "y": 20
    wz-energy-today:
      h: 6
      w: 8
      x: 16
      "y": 5
    wz-header:
      h: 1
      w: 24
      x: 0
      "y": 4
    wz-power-timeseries:
      h: 6
      w: 16
      x: 0
      "y": 5
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    active-moods:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Beleuchtung" AND state.name == "activeMoodsNum" }, by: { control.name }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Active Moods Over Time
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    controls-header:
      content: '### Lighting Moods & Switches'
      type: markdown
    header:
      content: "## \U0001F4A1 Lighting & Controls"
      type: markdown
    light-energy-bar:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "totalDay"
          AND (contains(control.name, "Zähler Licht") OR contains(control.name, "Zähler Wohnzimmer Licht") OR contains(control.name, "Lightstrip")) },
        by: { control.room } | fieldsAdd today = arrayLast(val) | filter isNotNull(today) |  sort today desc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Light Energy by Room
      type: data
      visualization: barChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            hidden: true
    light-energy-table:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "totalDay"
          AND (contains(control.name, "Zähler Licht") OR contains(control.name, "Zähler Wohnzimmer Licht") OR contains(control.name, "Lightstrip")) },
        by: { control.name, control.room } | fieldsAdd today = arrayLast(val) | filter isNotNull(today) | fields control.name, control.room, today | sort today desc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Light Energy Today (all zones)
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    meters-header:
      content: '### All Light Meters'
      type: markdown
    operating-mode:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Global" AND state.name == "operatingMode" } | fieldsAdd last = arrayLast(val) | fields last'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Operating Mode
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          trend:
            isVisible: false
    sunrise:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Global" AND state.name == "sunrise" } | fieldsAdd last = arrayLast(val) | fields last'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Sunrise
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          trend:
            isVisible: false
    sunset:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.name == "Global" AND state.name == "sunset" } | fieldsAdd last = arrayLast(val) | fields last'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Sunset
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          trend:
            isVisible: false
    switch-states:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(loxone.control.value), filter: { control.category == "Beleuchtung" AND state.name == "active" }, by: { control.name }'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Switch States Over Time
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    wz-energy-today:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "totalDay" AND unit == "kW"
          AND (control.name == "Zähler Wohnzimmer Licht MItte"
            OR control.name == "Zähler Wohnzimmer Licht Ost"
            OR control.name == "Zähler Wohnzimmer Licht West"
            OR control.name == "Zähler Wohnzimmer Lightstrip") },
        by: { control.name } | fieldsAdd latest = arrayLast(val) | filter isNotNull(latest) | fields control.name, latest
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Wohnzimmer Energy Today
      type: data
      visualization: pieChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          circleChartSettings:
            groupingThresholdType: relative
            valueType: relative
    wz-header:
      content: '### Wohnzimmer Lighting'
      type: markdown
    wz-power-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries val = avg(loxone.control.value), filter: { control.category == "Energie" AND state.name == "actual" AND unit == "kW"
          AND (control.name == "Zähler Wohnzimmer Licht MItte"
            OR control.name == "Zähler Wohnzimmer Licht Ost"
            OR control.name == "Zähler Wohnzimmer Licht West"
            OR control.name == "Zähler Wohnzimmer Lightstrip") },
        by: { control.name }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Wohnzimmer Light Power (kW)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
  variables: []
  version: 21
