id: d0321d6b-afa3-43ec-94bc-550b3b0a5984
name: Loxone Miniserver Health
type: dashboard
content:
  annotations: []
  importedWithCode: false
  layouts:
    header:
      h: 2
      w: 24
      x: 0
      "y": 0
    heap-kpi:
      h: 3
      w: 6
      x: 0
      "y": 2
    tasks-kpi:
      h: 3
      w: 6
      x: 6
      "y": 2
    lan-errors-kpi:
      h: 3
      w: 6
      x: 12
      "y": 2
    lan-packets-kpi:
      h: 3
      w: 6
      x: 18
      "y": 2
    system-header:
      h: 1
      w: 24
      x: 0
      "y": 5
    heap-timeseries:
      h: 6
      w: 12
      x: 0
      "y": 6
    tasks-timeseries:
      h: 6
      w: 12
      x: 12
      "y": 6
    lan-header:
      h: 1
      w: 24
      x: 0
      "y": 12
    lan-traffic:
      h: 6
      w: 12
      x: 0
      "y": 13
    lan-errors:
      h: 6
      w: 12
      x: 12
      "y": 13
    can-header:
      h: 1
      w: 24
      x: 0
      "y": 19
    can-traffic:
      h: 6
      w: 12
      x: 0
      "y": 20
    can-errors:
      h: 6
      w: 12
      x: 12
      "y": 20
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    header:
      content: |-
        ![Loxone](https://www.loxone.com/int/wp-content/uploads/sites/21/2022/06/IG-Miniserver.png)
        ### 🖥️ Miniserver Health
        System resources, LAN interface, and CAN bus diagnostics for the Loxone Miniserver.
      type: markdown
    heap-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries val = avg(loxone.system.heap) | fieldsAdd last = arrayLast(val)
      title: Heap Memory
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-13-default, #006bba)'
            isVisible: true
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 150000
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 75000
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 0
    tasks-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries val = avg(loxone.system.tasks) | fieldsAdd last = arrayLast(val)
      title: Active Tasks
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: last
          sparklineSettings:
            color:
              Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
            isVisible: true
          trend:
            isVisible: false
    lan-errors-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          tx_err = avg(loxone.lan.tx_errors),
          tx_coll = avg(loxone.lan.tx_collisions),
          rx_ovf = avg(loxone.lan.rx_overflow),
          eof = avg(loxone.lan.eof_errors)
        } | fieldsAdd total = arrayLast(tx_err) + arrayLast(tx_coll) + arrayLast(rx_ovf) + arrayLast(eof) | fields total
      title: LAN Errors (Total)
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: total
          trend:
            isVisible: false
        thresholds:
          - color: 'var(--dt-colors-charts-status-critical-default, #c62239)'
            isEnabled: true
            value: 100
          - color: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
            isEnabled: true
            value: 10
          - color: 'var(--dt-colors-charts-status-success-default, #2a7453)'
            isEnabled: true
            value: 0
    lan-packets-kpi:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          rx = avg(loxone.lan.rx_packets),
          tx = avg(loxone.lan.tx_packets)
        } | fieldsAdd total = arrayLast(rx) + arrayLast(tx) | fields total
      title: LAN Packets (Total)
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          recordField: total
          trend:
            isVisible: false
    system-header:
      content: '#### 🧠 System Resources'
      type: markdown
    heap-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries heap = avg(loxone.system.heap)
      title: Heap Memory Over Time
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-13-default, #006bba)'
              seriesId:
                - heap
    tasks-timeseries:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries tasks = avg(loxone.system.tasks)
      title: Tasks Over Time
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          legend:
            hidden: true
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-08-default, #8b6ecf)'
              seriesId:
                - tasks
    lan-header:
      content: '#### 🌐 LAN Interface'
      type: markdown
    lan-traffic:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          rx = avg(loxone.lan.rx_packets),
          tx = avg(loxone.lan.tx_packets)
        }
      title: LAN Packets (RX / TX)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-01-default, #134fc9)'
              seriesId:
                - rx
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-11-default, #627cfe)'
              seriesId:
                - tx
    lan-errors:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          tx_errors = avg(loxone.lan.tx_errors),
          tx_collisions = avg(loxone.lan.tx_collisions),
          rx_overflow = avg(loxone.lan.rx_overflow),
          eof_errors = avg(loxone.lan.eof_errors)
        }
      title: LAN Errors
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
              seriesId:
                - tx_errors
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              seriesId:
                - tx_collisions
            - override:
                color:
                  Default: 'var(--dt-colors-charts-loglevel-alert-default, #c73d84)'
              seriesId:
                - rx_overflow
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-04-default, #d85a9f)'
              seriesId:
                - eof_errors
    can-header:
      content: '#### 🔌 CAN Bus'
      type: markdown
    can-traffic:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          sent = avg(loxone.can.packets_sent),
          received = avg(loxone.can.packets_received)
        }
      title: CAN Packets (Sent / Received)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-01-default, #134fc9)'
              seriesId:
                - received
            - override:
                color:
                  Default: 'var(--dt-colors-charts-categorical-color-11-default, #627cfe)'
              seriesId:
                - sent
    can-errors:
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries {
          receive_errors = avg(loxone.can.receive_errors),
          frame_errors = avg(loxone.can.frame_errors),
          overruns = avg(loxone.can.overruns)
        }
      title: CAN Bus Errors
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          gapPolicy: connect
          seriesOverrides:
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-critical-default, #c62239)'
              seriesId:
                - receive_errors
            - override:
                color:
                  Default: 'var(--dt-colors-charts-status-warning-default, #eea53c)'
              seriesId:
                - frame_errors
            - override:
                color:
                  Default: 'var(--dt-colors-charts-loglevel-alert-default, #c73d84)'
              seriesId:
                - overruns
  version: 21
